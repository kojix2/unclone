name: paper PDF

on:
  push:
    paths: ["paper/**", ".github/workflows/paper-pdf.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["paper/**", ".github/workflows/paper-pdf.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install -r paper/requirements.txt
          make -C paper figures
      - uses: docker://pandoc/latex:3.8
        with:
          args: >-
            --from=markdown --citeproc --resource-path=paper
            --pdf-engine=xelatex --output=paper/paper.pdf paper/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: unclone-paper-pdf
          path: paper/paper.pdf
          if-no-files-found: error
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: paper/paper.pdf
