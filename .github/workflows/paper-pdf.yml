name: paper PDF

on:
  push:
    branches: ["main"]
    paths: ["paper/**", ".github/workflows/paper-pdf.yml"]
  pull_request:
    branches: ["main"]
    paths: ["paper/**", ".github/workflows/paper-pdf.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@v5
      - run: |
          python -m pip install -r paper/requirements.txt
          make -C paper figures
      - uses: docker://pandoc/latex:3.8
        with:
          args: >-
            --from=markdown --citeproc --resource-path=paper
            --pdf-engine=xelatex --output=paper/paper.pdf paper/paper.md
      - run: |
          mkdir -p site
          cp paper/paper.pdf site/paper.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
