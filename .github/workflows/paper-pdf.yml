name: paper PDF

on:
  push:
    branches: ["main"]
    paths: ["paper/**", ".github/workflows/paper-pdf.yml"]
  pull_request:
    branches: ["main"]
    paths: ["paper/**", ".github/workflows/paper-pdf.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@v5
      - run: |
          python -m pip install -r paper/requirements.txt
          make -C paper figures
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Generate English LaTeX
        run: |
          cd paper
          pandoc paper.md --standalone --from=markdown --citeproc --output=paper.preprint.tex
      - name: Build English PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.preprint.tex
          working_directory: paper
          os: debian
      - name: Rename English PDF
        run: mv paper/paper.preprint.pdf paper/paper.pdf
      - name: Generate Japanese LaTeX
        run: |
          cd paper
          pandoc paper-ja.md --standalone --from=markdown --citeproc --output=paper.preprint.tex
      - name: Build Japanese PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.preprint.tex
          working_directory: paper
          os: debian
          latexmk_use_lualatex: true
          extra_system_packages: fonts-noto-cjk
      - name: Rename Japanese PDF
        run: mv paper/paper.preprint.pdf paper/paper-ja.pdf
      - run: |
          mkdir -p site
          cp paper/paper.pdf site/paper.pdf
          cp paper/paper-ja.pdf site/paper-ja.pdf
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
